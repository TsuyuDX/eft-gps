<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>TarkovHead · Offline</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <header>
      <div class="topline">
        <a class="brand" href="#/"
          ><img id="logo" width="56" height="56" alt="TarkovHead" /><strong
            >TarkovHead</strong
          ><small>OFFLINE</small></a
        >
        <nav id="navigation" aria-label="Основные разделы"></nav>
        <button id="menu" aria-label="Открыть меню">☰</button>
      </div>
      <div class="statusline">
        <div class="row">
          <span class="time" id="raid-time"></span
          ><span class="pill online-dot">Локальная база</span
          ><span class="muted" id="snapshot-date">Подготовка базы…</span>
        </div>
        <div class="row">
          <button class="quiet" id="settings-link">⚙ Данные и прогресс</button
          ><select id="mode" aria-label="Режим игры">
            <option value="regular">⚔ PVP</option>
            <option value="pve">♧ PVE</option>
          </select>
        </div>
      </div>
    </header>
    <main id="app"><div class="empty">Загрузка локальной базы…</div></main>
    <footer>
      <span
        >Игровые материалы © Battlestate Games. Данные: TarkovHead /
        Tarkov.dev.</span
      ><span
        >Локальное приложение ·
        <a href="#/settings">Состояние офлайн-базы</a></span
      >
    </footer>
    <dialog id="modal">
      <button class="close" aria-label="Закрыть">×</button>
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
