name: Publish verified offline versions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-offline-releases
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Test the application before publishing
        shell: pwsh
        run: |
          & .\runtime\node.exe --test test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed; release stopped.' }
      - name: Test native downloader and resume behaviour
        shell: pwsh
        run: |
          & .\test\setup-transfer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native downloader checks failed.' }
      - name: Test embedded Overlay ownership and settings
        shell: pwsh
        run: |
          & .\test\overlay.ps1 -EmbeddedOnly
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Overlay checks failed.' }
      - name: Build and publish saved application versions sequentially
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/publish-snapshots.mjs
